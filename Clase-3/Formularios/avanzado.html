<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 3 Formularios</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>
<body>
    <div class="container mt-5">
        <h1>Crear Cuenta</h1>
        <form>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label" id="nombre">Nombre:</label>
                    <input type="text" class="form-control" id="nombre">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="apellido" class="form-label">Apellido:</label>
                    <input type="text" class="form-control" id="apellido">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="text" class="form-control" id="email" placeholder="joedoe@example.com">
            </div>
            <div class="mb-3">
                <label for="pais" class="form-label">Pais:</label>
                <select name="pais" id="pais" class="form-select">
                    <option value="AR">Argentina</option>
                    <option value="FR">Francia</option>
                    <option value="BR">Brasil</option>
                    <option value="NO" selected disabled>No seleccionado</option>
                </select>
            </div>
            <div class="mb-3">
                <label>TIpo de usuario:</label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="tipo_usuario" id="cliente">
                    <label class="form-check-label" for="cliente">
                        Cliente
                    </label>
                </div>
                <div class="form-check">
                    <input type="radio" name="tipo_usuario" id="empresa" class="form-check-input">
                    <label for="empresa" class="form-check-label">Empresa</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="comentarios" class="form-label">Comentarios:</label>
                <textarea name="comentarios" id="comentarios" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terminos">
                <label for="terminos" class="form-check-label">Acepto todos los terminos y condiciones</label>
            </div>

            <button class="btn btn-primary" type="submit">Crear Cuenta</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
